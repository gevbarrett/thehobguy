backend:
  name: git-gateway
  branch: master

media_folder: 'public/assets/'
public_folder: '/assets'

editor:
 preview: false

collections:
  - name: 'home'
    label: 'Home Page'
    folder: 'src/'
    slug: '{{year}}-{{month}}-{{day}}-{{slug}}'
    fields:
      - { label: 'Site Title', name: 'title', widget: 'string' }
      - { label: 'SEO Description 170 chars', name: 'description', widget: 'text' }
      - label: 'Section 1 - hero '
        name: 'hero'
        widget: 'object'
        fields:
          - { label: 'Hero Heading', name: 'header', widget: 'string' }
          - { label: 'Sub Header', name: 'subhead', widget: 'string' }
          - { label: 'Hero Text', name: 'text', widget: 'text' }
      
      - label: 'Section - Icon Cards'
        name: 'bullet'
        widget: 'list'
        fields:
          - { label: 'Heading', name: 'header', widget: 'string' }
          - { label: 'Icon', name: 'icon', widget: 'string' }
          - { label: 'Text', name: 'text', widget: 'text' }

      - label: 'Section - About Us'
        name: 'bio'
        widget: 'object'
        fields:
          - { label: 'Bio Text', name: 'header', widget: 'string' }
          - { label: 'Paragraph 1', name: 'para1', widget: 'text' }
          - { label: 'Paragraph 2', name: 'para2', widget: 'text' }
          - { label: 'Image 1', name: 'image', widget: 'image' }
          - { label: 'Image 1 Alt', name: 'alt', widget: 'string' }
          - { label: 'Image 2', name: 'image2', widget: 'image' }
          - { label: 'Image 2 Alt', name: 'alt2', widget: 'string' }
          - { label: 'Bullet Point', name: 'check1', widget: 'string' }
          - { label: 'Bullet Point', name: 'check2', widget: 'string' }
          - { label: 'Bullet Point', name: 'check3', widget: 'string' }
          - { label: 'Bullet Point', name: 'check4', widget: 'string' }

      - label: 'Section - Image with Text'
        name: 'panel'
        widget: 'object'
        fields:
          - { label: 'Header', name: 'header', widget: 'string' }
          - { label: 'Text', name: 'subHead', widget: 'Text' }
          - { label: 'Image', name: 'image', widget: 'image' }
          - { label: 'Image Alt Text', name: 'alt', widget: 'string' }
          - label: 'Check List'
            name: 'info'
            widget: 'list'
            fields:
              - { label: 'Heading', name: 'header', widget: 'string' }
              - { label: 'Text', name: 'text', widget: 'string' }

      - label: 'Section - Mission Statement Panel'
        name: 'test'
        widget: 'object'
        fields:
          - { label: 'Testimonial Name', name: 'header', widget: 'string' }
          - { label: 'Text', name: 'text', widget: 'text' }

      - label: 'Affiliate Logos'
        name: 'logos'
        widget: 'list'
        fields:
          - { label: 'Image Alt Text for SEO', name: 'alt', widget: 'string' }
          - { label: 'Logo Image', name: 'image', widget: 'image' }

      - label: 'Section - Certificate'
        name: 'cert'
        widget: 'object'
        fields:
          - { label: 'Heading', name: 'header', widget: 'string' }
          - { label: 'Text', name: 'text', widget: 'text' }
          - { label: 'Image', name: 'image', widget: 'image' }
          - { label: 'Image Alt Text for SEO', name: 'alt', widget: 'string' }

      - label: 'Review/Testimonial'
        name: 'testimonials'
        widget: 'object'
        fields:
          - { label: 'Heading', name: 'header', widget: 'string' }
          - { label: 'Text', name: 'text', widget: 'text' }
          - label: 'Reviews'
            name: 'list'
            widget: 'list'
            fields:  
              - { label: 'Review Name', name: 'name', widget: 'text' }
              - { label: 'Review Heading', name: 'header', widget: 'string' }
              - { label: 'Review', name: 'description', widget: 'text' }
              - { label: 'Review Source', name: 'company', widget: 'string', required: false }

      - label: 'Section - Icon Cards with background'
        name: 'bullet2'
        widget: 'object'
        fields:
          - { label: 'Heading', name: 'header', widget: 'string' }
          - label: 'Edit Icon Card'
            name: 'list'
            widget: 'list'
            fields:
              - { label: 'Heading', name: 'header', widget: 'string' }
              - { label: 'Icon', name: 'icon', widget: 'string' }
              - { label: 'Text', name: 'text', widget: 'text' }

      - label: 'Section - FAQ'
        name: 'faq'
        widget: 'list'
        fields:
          - { label: 'Question', name: 'question', widget: 'string' }
          - { label: 'Answer', name: 'answer', widget: 'text'}

      - label: 'Section - Map'
        name: 'map'
        widget: 'object'
        fields:
          - { label: 'Heading', name: 'header', widget: 'string' }
          - { label: 'Text', name: 'text', widget: 'text' }

      - label: 'Section - Final Call to Action Panel'
        name: 'cta'
        widget: 'object'
        fields:
          - { label: 'Heading', name: 'header', widget: 'string' }
          - { label: 'Text', name: 'text', widget: 'text' }

  - name: 'about-page'
    label: 'About Page'
    folder: 'src/about'
    slug: '{{year}}-{{month}}-{{day}}-{{slug}}'
    fields:
      - { label: 'Header H1', name: 'h1', widget: 'string' }
      - { label: 'SEO Description 170 chars', name: 'description', widget: 'text' }
      - { label: "Body Text", name: "body", widget: "markdown"}
      - label: 'Call to Action Bottom'
        name: 'cta'
        widget: 'object'
        fields:
          - { label: 'Header', name: 'header', widget: 'text' }
          - { label: 'Featured Image', name: 'text', widget: 'text' }
          - { label: 'Button Text', name: 'button', widget: 'string' }
          - { label: 'Button Link', name: 'link', widget: 'string' }


  - name: 'services'
    label: 'Service Pages'
    folder: 'src/services'
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Page Title ( Max 60 Characters )", name: "title", widget: "string" }
      - label: 'Breadcrumb'
        name: 'eleventyNavigation'
        widget: object
        fields:
          - { label: 'Breadcrumb Title', name: 'key', widget: 'string', required: true }
          - { label: 'Parent Page (Value = Services)', name: 'parent', widget: 'string', required: true }
      - { label: "Header", name: "h1", widget: "string" }
      - { label: 'SEO Description 160 chars', name: 'description', widget: 'text' }
      - { label: "Featured Image", name: "image", widget: "image" }
      - { label: "Body", name: "body", widget: "markdown"}
      - label: 'Call to Action Bottom'
        name: 'cta'
        widget: 'object'
        fields:
          - { label: 'Header', name: 'header', widget: 'text' }
          - { label: 'Featured Image', name: 'text', widget: 'text' }
          - { label: 'Button Text', name: 'button', widget: 'string' }
          - { label: 'Button Link', name: 'link', widget: 'string' }
      # - label: 'Testimonial'
      #   name: 'testimonial'
      #   widget: 'object'
      #   fields:
      #     - { label: 'Name', name: 'name', widget: 'string' }
      #     - { label: 'Image', name: 'image', widget: 'image' }
      #     - { label: 'Image Alt Text', name: 'alt', widget: 'string' }
      #     - { label: 'Testimonial Text', name: 'text', widget: 'text' }
      # - { label: "CTA Text", name: "cta", widget: "text" }
  
  - name: "projects"
    label: "Projects"
    folder: "src/projects"
    create: true
    fields:
      - { label: "Page Title ( Max 60 Characters )", name: "title", widget: "string" }
      - label: 'Breadcrumb'
        name: 'eleventyNavigation'
        widget: object
        fields:
          - { label: 'Breadcrumb Title', name: 'key', widget: 'string', required: true }
          - { label: 'Parent Page (Value = Projects)', name: 'parent', widget: 'string', required: true }
      - { label: "Header H1", name: "h1", widget: "string" }
      - { label: "Description ( 160 Chars Recommended )", name: "description", widget: "string" }
      - { label: "Featured Image", name: "image", widget: "image" }
      - label: 'Image Gallery'
        name: 'gallery'
        widget: 'list'
        fields:
          - { label: 'Image Alt Text for SEO', name: 'name', widget: 'string' }
          - { label: 'Activity Image', name: 'image', widget: 'image' }
      - { label: "Company Name", name: "name", widget: "string" }
      - { label: "Location", name: "location", widget: "string" }
      - { label: "Service Type", name: "service", widget: "string" }
      - { label: "Year of Project", name: "year", widget: "string" }
      - { label: "Body", name: "body", widget: "markdown"}
      - label: 'Call to Action Bottom'
        name: 'cta'
        widget: 'object'
        fields:
          - { label: 'Header', name: 'header', widget: 'text' }
          - { label: 'Featured Image', name: 'text', widget: 'text' }
          - { label: 'Button Text', name: 'button', widget: 'string' }
          - { label: 'Button Link', name: 'link', widget: 'string' }
  
  - name: "faq"
    label: "FAQ Page"
    folder: "src/faq`"
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: 'SEO Description 170 chars', name: 'description', widget: 'text' }
      - { label: "Body", name: "body", widget: "markdown"}  
      - label: 'Call to Action Bottom'
        name: 'cta'
        widget: 'object'
        fields:
          - { label: 'Header', name: 'header', widget: 'text' }
          - { label: 'Featured Image', name: 'text', widget: 'text' }
          - { label: 'Button Text', name: 'button', widget: 'string' }
          - { label: 'Button Link', name: 'link', widget: 'string' }

  - name: "gallery"
    label: "Gallery Page"
    folder: "src/gallery"
    fields:
      - { label: "header", name: "h1", widget: "string" }
      - { label: 'SEO Description 170 chars', name: 'description', widget: 'text' }
      - { label: "Body", name: "body", widget: "markdown"}
      - label: 'Image Gallery'
        name: 'gallery'
        widget: 'list'
        fields:  
          - { label: 'Image Description', name: 'text', widget: 'string' }
          - { label: 'Activity Image', name: 'image', widget: 'image' }
      - label: 'Call to Action Bottom'
        name: 'cta'
        widget: 'object'
        fields:
          - { label: 'Header', name: 'header', widget: 'text' }
          - { label: 'Featured Image', name: 'text', widget: 'text' }
          - { label: 'Button Text', name: 'button', widget: 'string' }
          - { label: 'Button Link', name: 'link', widget: 'string' }

  - name: "contact"
    label: "Contact Page"
    folder: "src/contact"
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: 'SEO Description 170 chars', name: 'description', widget: 'text' }
      - { label: "Body", name: "body", widget: "markdown"}  

  - name: 'policy-documents'
    label: 'Policy Docs Page'
    folder: 'src/policy-documents'
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: 'SEO Description 170 chars', name: 'description', widget: 'text' }
      - { label: "Body", name: "body", widget: "markdown"}
      - label: 'Documents'
        name: 'docs'
        widget: 'list'
        fields:
          - { label: 'Name', name: 'name', widget: 'string' }
          - { label: 'File', name: 'link', widget: 'file', required: false }  

  - name: "pages"
    label: "Other Pages, Privacy Policy etc"
    folder: "src/pages"
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Title - for Google SEO", name: "title", widget: "string" }
      - { label: "Page Header", name: "h1", widget: "string" }
      - { label: "Description for SEO 170 chars", name: "description", widget: "text" }
      - { label: "Body", name: "body", widget: "markdown"} 
      - label: 'Call to Action Bottom'
        name: 'cta'
        widget: 'object'
        fields:
          - { label: 'Header', name: 'header', widget: 'text' }
          - { label: 'Featured Image', name: 'text', widget: 'text' }
          - { label: 'Button Text', name: 'button', widget: 'string' }
          - { label: 'Button Link', name: 'link', widget: 'string' }
  
  - name: 'settings'
    label: 'Site Settings'
    delete: false # Prevent users from deleting documents in this collection
    editor:
      preview: false
    files:
      - name: 'general'
        label: 'Site Settings'
        file: 'src/_data/settings.json'
        description: 'General Site Settings'
        fields:
          - { label: 'Site title', name: 'name', widget: 'string' }
          - { label: 'Site Web Address', name: 'domain', widget: 'string' }
          # - { label: 'Site tag line', name: 'tagline', widget: 'string' }
          - { label: 'Site Description SEO', name: 'description', widget: 'text' }
          # - { label: 'Logo', name: 'logo', widget: 'image' }
          # - { label: 'Footer Logo', name: 'footer_logo', widget: 'image' }
          - { label: 'Phone Number', name: 'phone', widget: 'string' }
          - { label: 'Phone Number for display', name: 'phone_display', widget: 'string' }
          - { label: 'landline Number', name: 'landline', widget: 'string' }
          - { label: 'landline Number for display', name: 'landline_display', widget: 'string' }
          - { label: 'Email Address', name: 'email', widget: 'string' }
          - { label: 'Address Line 1', name: 'address1', widget: 'string' }
          - { label: 'Address Line 2', name: 'address2', widget: 'string' }
          - { label: 'Address Line 3', name: 'address3', widget: 'string' }
          - { label: 'Facebook Link', name: 'facebook', widget: 'string' }
          - { label: 'Google Link', name: 'google', widget: 'string' }
          - { label: 'Linkedin Link', name: 'linkedin', widget: 'string' }



